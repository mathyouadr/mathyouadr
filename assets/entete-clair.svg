  <path d="M632 218 C 720 218, 700 174, 784 174" pathLength="1" class="cable-gaine" fill="none" stroke="#1f8f55" stroke-width="7" stroke-linecap="round"/>
  <path d="M632 218 C 720 218, 700 174, 784 174" class="cable-rayure" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 9"/>
  <circle r="5" class="paquet" fill="#fafbf9" stroke="#1f8f55" stroke-width="3">
    <animateMotion dur="2.75s" begin="1.9s" repeatCount="indefinite"><mpath href="#cable-1"/></animateMotion>
  </circle>
</g>
<g>
  <rect x="784" y="144" width="198" height="60" rx="12" fill="#fafbf9" stroke="#d4d8d3" stroke-width="1.5"/>
  <rect x="784" y="144" width="6" height="60" rx="3" fill="#1f8f55"/>
  <text x="802" y="170" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#14171a">Réseaux</text>
  <text x="802" y="190" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11.5" fill="#555d65">Switchs, brassage, DHCP</text>
</g>
<g style="--i:2">
  <path d="M632 240 C 720 240, 700 290, 784 290" pathLength="1" class="cable-gaine" fill="none" stroke="#2450d8" stroke-width="7" stroke-linecap="round"/>
  <path d="M632 240 C 720 240, 700 290, 784 290" class="cable-rayure" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 9"/>
  <circle r="5" class="paquet" fill="#fafbf9" stroke="#2450d8" stroke-width="3">
    <animateMotion dur="3.10s" begin="2.2s" repeatCount="indefinite"><mpath href="#cable-2"/></animateMotion>
  </circle>
</g>
<g>
  <rect x="784" y="260" width="198" height="60" rx="12" fill="#fafbf9" stroke="#d4d8d3" stroke-width="1.5"/>
  <rect x="784" y="260" width="6" height="60" rx="3" fill="#2450d8"/>
  <text x="802" y="286" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#14171a">Électronique</text>
  <text x="802" y="306" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11.5" fill="#555d65">ESP32, RP2040</text>
