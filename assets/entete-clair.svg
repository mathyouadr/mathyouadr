  <path d="M632 262 C 720 262, 700 406, 784 406" pathLength="1" class="cable-gaine" fill="none" stroke="#8b5a36" stroke-width="7" stroke-linecap="round"/>
  <path d="M632 262 C 720 262, 700 406, 784 406" class="cable-rayure" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 9"/>
  <circle r="5" class="paquet" fill="#fafbf9" stroke="#8b5a36" stroke-width="3">
    <animateMotion dur="3.45s" begin="2.5s" repeatCount="indefinite"><mpath href="#cable-3"/></animateMotion>
  </circle>
</g>
<g>
  <rect x="784" y="376" width="198" height="60" rx="12" fill="#fafbf9" stroke="#d4d8d3" stroke-width="1.5"/>
  <rect x="784" y="376" width="6" height="60" rx="3" fill="#8b5a36"/>
  <text x="802" y="402" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#14171a">Hack The Box</text>
  <text x="802" y="422" font-family="'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace" font-size="11.5" fill="#555d65">34 machines</text>
