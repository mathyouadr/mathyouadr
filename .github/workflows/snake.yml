name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2450d8&color_dots=#e4e7e3,#9db3f5,#7196ff,#2450d8,#1b3fb0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7196ff&color_dots=#161b1f,#152046,#2d4595,#7196ff,#9bb4ff

      - name: push svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
